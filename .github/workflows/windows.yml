name: Eseguibile Windows

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv run lolpick-update
        continue-on-error: true  # se le fonti rifiutano la richiesta restano i dati del repository
      - run: uv run --with pyinstaller python packaging/build.py
      - uses: actions/upload-artifact@v4
        with:
          name: lolpick-windows
          path: dist/lolpick/
